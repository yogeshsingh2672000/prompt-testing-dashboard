name: Docs or discoverability improvement
description: Suggest README, onboarding, launch, or SEO improvements
title: "[Docs/Discovery]: "
labels: ["documentation", "seo"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is confusing, weak, or missing?
      description: Call out the exact page, section, or launch asset that needs work.
      placeholder: The README does not show a clear example of structured output validation.
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: What should improve?
      description: Share better copy, structure, screenshots, demo flow, metadata, or search keywords.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Why does it matter?
      description: Explain how this improves clarity, onboarding, conversion, or search visibility.
